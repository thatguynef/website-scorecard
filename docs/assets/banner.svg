<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Website Scorecard — find where local home-service websites leak customers and revenue</title>
  <desc id="bannerDesc">Dark banner with the Website Scorecard mark, a headline about local home-service websites, the trades it covers, and a sample score card showing 68 out of 100, band C, with verified, strong-signal, and owner-data findings.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#FF3B3B" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FF3B3B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" x2="1">
      <stop offset="0" stop-color="#FF3B3B" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FF3B3B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="#0B0B0C"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#rule)"/>

  <g transform="translate(64,46)" aria-hidden="true">
    <rect width="40" height="40" rx="10" fill="#141416" stroke="#2A2A2E"/>
    <path d="M10 29 A 10 10 0 0 1 30 29" fill="none" stroke="#2A2A2E" stroke-width="4" stroke-linecap="round"/>
    <path d="M10 29 A 10 10 0 0 1 25 19.7" fill="none" stroke="#FF3B3B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="20" cy="29" r="2" fill="#F7F7F5"/>
    <path d="M20 29 L26 22" stroke="#F7F7F5" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text x="118" y="73" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="13" letter-spacing="2.6" fill="#A6A6AA">WEBSITE SCORECARD</text>

  <text x="64" y="135" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="11.5" letter-spacing="2.4" fill="#FF3B3B">FOR LOCAL HOME-SERVICE BUSINESSES</text>

  <text x="64" y="187" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="42" font-weight="700" fill="#F7F7F5">Find where local home-service</text>
  <text x="64" y="233" font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="42" font-weight="700" fill="#F7F7F5">websites leak customers.</text>

  <text x="64" y="270" font-family="'Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#A6A6AA">Plumbing · HVAC · Roofing · Electrical · Pest control · Garage door · Landscaping</text>
  <text x="64" y="298" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="10" letter-spacing="1.8" fill="#6B6B70">OPEN SOURCE · MIT · EVIDENCE-BASED</text>

  <g>
    <rect x="848" y="48" width="288" height="224" rx="16" fill="#141416" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <text x="872" y="82" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="9.5" letter-spacing="2.2" fill="#FF3B3B">SAMPLE SCORE</text>

    <text x="872" y="154" font-family="'Space Grotesk','Inter',system-ui,sans-serif" font-size="62" font-weight="700" fill="#F7F7F5">68</text>
    <text x="962" y="154" font-family="'Inter',system-ui,sans-serif" font-size="16" fill="#6B6B70">/ 100</text>

    <rect x="872" y="170" width="146" height="26" rx="13" fill="#FF3B3B" fill-opacity="0.13"/>
    <text x="945" y="187" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="10" letter-spacing="1.8" fill="#FF8F8F">C — AVERAGE</text>

    <g font-family="'Inter',system-ui,sans-serif" font-size="10.5" fill="#A6A6AA">
      <circle cx="877" cy="219" r="3.5" fill="#3FBF7F"/>
      <text x="891" y="223">Verified leak</text>
      <circle cx="877" cy="241" r="3.5" fill="#F5C766"/>
      <text x="891" y="245">Strong signal</text>
      <circle cx="877" cy="263" r="3.5" fill="#6B6B70"/>
      <text x="891" y="267">Owner data required</text>
    </g>
  </g>
</svg>
