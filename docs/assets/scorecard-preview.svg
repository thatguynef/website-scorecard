<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title">
  <title id="title">Synthetic Acme Plumbing Website Scorecard showing 68 out of 100 and three labeled findings</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="92%" cy="0%" r="80%">
      <stop offset="0" stop-color="#FF3B3B" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#FF3B3B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="820" fill="#0B0B0C"/>
  <rect width="1200" height="820" fill="url(#grid)"/>
  <rect x="36" y="36" width="1128" height="748" rx="18" fill="#141416" stroke="#2A2A2E"/>
  <text x="76" y="90" fill="#FF8F8F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="3">SYNTHETIC SAMPLE REPORT</text>
  <text x="76" y="138" fill="#F7F7F5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="700">Website Scorecard</text>
  <text x="76" y="176" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="400">Acme Plumbing (synthetic) · Example County, CA</text>
  <rect x="76" y="208" width="300" height="150" rx="12" fill="#1C1C1F" stroke="#2A2A2E"/>
  <text x="100" y="268" fill="#F7F7F5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="68" font-weight="700">68</text>
  <text x="204" y="266" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400">/ 100</text>
  <text x="100" y="306" fill="#F5C766" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2">C · AVERAGE</text>
  <text x="100" y="334" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="400">Public website score</text>
  <g transform="translate(408 208)">
    <text x="0" y="20" fill="#FF8F8F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2">THE THREE BIGGEST REVENUE LEAKS</text>
    <rect x="0" y="40" width="680" height="72" rx="10" fill="#1C1C1F" stroke="#2A2A2E"/>
    <text x="20" y="66" fill="#F7F7F5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="600">Mobile estimate form is difficult to complete</text>
    <text x="20" y="94" fill="#3FBF7F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1">VERIFIED</text>
    <text x="150" y="94" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400">Six fields, weak labels and autocomplete.</text>
    <rect x="0" y="120" width="680" height="72" rx="10" fill="#1C1C1F" stroke="#2A2A2E"/>
    <text x="20" y="146" fill="#F7F7F5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="600">No observable acknowledgement after submission</text>
    <text x="20" y="174" fill="#F5C766" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1">STRONG SIGNAL</text>
    <text x="180" y="174" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400">No response time or channel is promised.</text>
    <rect x="0" y="200" width="680" height="72" rx="10" fill="#1C1C1F" stroke="#2A2A2E"/>
    <text x="20" y="226" fill="#F7F7F5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="600">Unclosed estimates may not get follow-up</text>
    <text x="20" y="254" fill="#FF8F8F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1">OWNER DATA REQUIRED</text>
    <text x="238" y="254" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400">A question for the CRM, not a site penalty.</text>
  </g>
  <g transform="translate(76 590)">
    <text x="0" y="0" fill="#FF8F8F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2">SCORE BREAKDOWN</text>
    <g transform="translate(0 24)">
      <rect width="238" height="52" rx="8" fill="#1C1C1F"/>
      <text x="14" y="20" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Understand</text>
      <text x="14" y="42" fill="#F7F7F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">14.4 / 20</text>
    </g>
    <g transform="translate(260 24)">
      <rect width="238" height="52" rx="8" fill="#1C1C1F"/>
      <text x="14" y="20" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Contact</text>
      <text x="14" y="42" fill="#F7F7F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">18.7 / 22</text>
    </g>
    <g transform="translate(520 24)">
      <rect width="238" height="52" rx="8" fill="#1C1C1F"/>
      <text x="14" y="20" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Respond &amp; Book</text>
      <text x="14" y="42" fill="#F7F7F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">11.0 / 16</text>
    </g>
    <g transform="translate(780 24)">
      <rect width="238" height="52" rx="8" fill="#1C1C1F"/>
      <text x="14" y="20" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Trust</text>
      <text x="14" y="42" fill="#F7F7F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">9.0 / 15</text>
    </g>
    <g transform="translate(0 86)">
      <rect width="238" height="52" rx="8" fill="#1C1C1F"/>
      <text x="14" y="20" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Mobile &amp; Technical</text>
      <text x="14" y="42" fill="#F7F7F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">8.0 / 15</text>
    </g>
    <g transform="translate(260 86)">
      <rect width="238" height="52" rx="8" fill="#1C1C1F"/>
      <text x="14" y="20" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Findability</text>
      <text x="14" y="42" fill="#F7F7F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">5.0 / 8</text>
    </g>
    <g transform="translate(520 86)">
      <rect width="238" height="52" rx="8" fill="#1C1C1F"/>
      <text x="14" y="20" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Measurement</text>
      <text x="14" y="42" fill="#F7F7F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">2.0 / 4</text>
    </g>
  </g>
  <text x="76" y="752" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="400">Synthetic example. Not a real business. Public Mode · Evidence first · Owner data separate.</text>

</svg>
