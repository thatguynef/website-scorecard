    <rect x="970" y="72" width="170" height="96" rx="10" fill="#141416" stroke="#2A2A2E"/>
    <rect x="971" y="72" width="168" height="3" rx="1.5" fill="#F5C766"/>
    <text x="986" y="98" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="1" fill="#6B6B70">06</text>
    <text x="986" y="128" font-family="'Inter',ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600" fill="#F7F7F5">Booking</text>
    <text x="986" y="152" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="0.6" fill="#F5C766">SCORED + OWNER</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="60" y="190" width="170" height="96" rx="10" fill="#141416" stroke="#2A2A2E"/>
    <rect x="61" y="190" width="168" height="3" rx="1.5" fill="#F5C766"/>
    <text x="76" y="216" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="1" fill="#6B6B70">07</text>
    <text x="76" y="246" font-family="'Inter',ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600" fill="#F7F7F5">Estimate</text>
    <text x="76" y="270" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="0.6" fill="#F5C766">SCORED + OWNER</text>
  </g>
  <g>
    <rect x="242" y="190" width="170" height="96" rx="10" fill="#101012" stroke="#3A3A40" stroke-dasharray="4 4"/>
    <rect x="243" y="190" width="168" height="3" rx="1.5" fill="#6B6B70"/>
    <text x="258" y="216" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="1" fill="#6B6B70">08</text>
    <text x="258" y="246" font-family="'Inter',ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600" fill="#8A8A90">Follow-up</text>
