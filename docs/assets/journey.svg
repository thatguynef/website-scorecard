  </g>
  <g>
    <rect x="424" y="190" width="170" height="96" rx="10" fill="#101012" stroke="#3A3A40" stroke-dasharray="4 4"/>
    <rect x="425" y="190" width="168" height="3" rx="1.5" fill="#6B6B70"/>
    <text x="440" y="216" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="1" fill="#6B6B70">09</text>
    <text x="440" y="246" font-family="'Inter',ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600" fill="#8A8A90">Customer</text>
    <text x="440" y="270" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="0.6" fill="#6B6B70">OWNER DATA</text>
  </g>
  <g>
    <rect x="606" y="190" width="170" height="96" rx="10" fill="#141416" stroke="#2A2A2E"/>
    <rect x="607" y="190" width="168" height="3" rx="1.5" fill="#F5C766"/>
    <text x="622" y="216" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="1" fill="#6B6B70">10</text>
    <text x="622" y="246" font-family="'Inter',ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600" fill="#F7F7F5">Review</text>
    <text x="622" y="270" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="0.6" fill="#F5C766">SCORED + OWNER</text>
  </g>
  <g>
    <rect x="788" y="190" width="170" height="96" rx="10" fill="#101012" stroke="#3A3A40" stroke-dasharray="4 4"/>
    <rect x="789" y="190" width="168" height="3" rx="1.5" fill="#6B6B70"/>
    <text x="804" y="216" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="1" fill="#6B6B70">11</text>
    <text x="804" y="246" font-family="'Inter',ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600" fill="#8A8A90">Referral</text>
    <text x="804" y="270" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="0.6" fill="#6B6B70">OWNER DATA</text>
  </g>
  <g>
    <rect x="970" y="190" width="170" height="96" rx="10" fill="#101012" stroke="#3A3A40" stroke-dasharray="4 4"/>
    <rect x="971" y="190" width="168" height="3" rx="1.5" fill="#6B6B70"/>
    <text x="986" y="216" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="1" fill="#6B6B70">12</text>
    <text x="986" y="246" font-family="'Inter',ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600" fill="#8A8A90">Reactivation</text>
    <text x="986" y="270" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="0.6" fill="#6B6B70">OWNER DATA</text>
