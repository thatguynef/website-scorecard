    <rect x="788" y="72" width="170" height="96" rx="10" fill="#141416" stroke="#2A2A2E"/>
    <rect x="789" y="72" width="168" height="3" rx="1.5" fill="#F5C766"/>
    <text x="804" y="98" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="1" fill="#6B6B70">05</text>
