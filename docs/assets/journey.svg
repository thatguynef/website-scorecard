  <!-- Legend -->
  <g font-family="'Inter',ui-sans-serif,system-ui,sans-serif" font-size="10.5" fill="#A6A6AA">
    <circle cx="60" cy="326" r="3.5" fill="#FF3B3B"/>
    <text x="72" y="330">Scored</text>
    <circle cx="164" cy="326" r="3.5" fill="#F5C766"/>
    <text x="176" y="330">Scored + owner data</text>
    <circle cx="352" cy="326" r="3.5" fill="#6B6B70"/>
    <text x="364" y="330">Owner data required</text>
  </g>
  <text x="1140" y="330" text-anchor="end" font-family="'Inter',ui-sans-serif,system-ui,sans-serif" font-size="10.5" fill="#6B6B70">Owner-data stages never reduce the website score.</text>
</svg>
