<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="journeyTitle journeyDesc">
  <title id="journeyTitle">The 12-stage home-service customer journey</title>
  <desc id="journeyDesc">Twelve stages from Visitor to Reactivation. Visitor, Understanding, and Lead are fully scored; Response through Estimate and Review are scored with owner data; Follow-up, Customer, Referral, and Reactivation require owner data and never reduce the website score.</desc>
  <defs>
    <pattern id="jgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="18" fill="#0B0B0C"/>
  <rect width="1200" height="360" rx="18" fill="url(#jgrid)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="17.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="32" y="38" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="11" letter-spacing="2.2" fill="#FF3B3B">THE 12-STAGE JOURNEY</text>

  <!-- Row 1 -->
  <g>
    <rect x="60" y="72" width="170" height="96" rx="10" fill="#141416" stroke="#2A2A2E"/>
    <rect x="61" y="72" width="168" height="3" rx="1.5" fill="#FF3B3B"/>
    <text x="76" y="98" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="1" fill="#6B6B70">01</text>
    <text x="76" y="128" font-family="'Inter',ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600" fill="#F7F7F5">Visitor</text>
    <text x="76" y="152" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="0.6" fill="#FF8F8F">SCORED</text>
  </g>
  <g>
    <rect x="242" y="72" width="170" height="96" rx="10" fill="#141416" stroke="#2A2A2E"/>
    <rect x="243" y="72" width="168" height="3" rx="1.5" fill="#FF3B3B"/>
    <text x="258" y="98" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="1" fill="#6B6B70">02</text>
    <text x="258" y="128" font-family="'Inter',ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600" fill="#F7F7F5">Understanding</text>
    <text x="258" y="152" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="0.6" fill="#FF8F8F">SCORED</text>
  </g>
  <g>
    <rect x="424" y="72" width="170" height="96" rx="10" fill="#141416" stroke="#2A2A2E"/>
    <rect x="425" y="72" width="168" height="3" rx="1.5" fill="#FF3B3B"/>
    <text x="440" y="98" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="1" fill="#6B6B70">03</text>
    <text x="440" y="128" font-family="'Inter',ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600" fill="#F7F7F5">Lead</text>
    <text x="440" y="152" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="0.6" fill="#FF8F8F">SCORED</text>
