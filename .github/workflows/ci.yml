name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scorer tests
        run: python3 -m unittest discover -s .opencode/skills/home-service-website-audit/scripts -p 'test_*.py'

      - name: Pipeline tests
        run: node --test .opencode/skills/home-service-website-audit/scripts/test_pipeline.mjs

      - name: Validate rubric
        run: python3 .opencode/skills/home-service-website-audit/scripts/validate_rubric.py

      - name: Generated documentation freshness
        run: |
          python3 .opencode/skills/home-service-website-audit/scripts/render_rubric.py --check
          python3 .opencode/skills/home-service-website-audit/scripts/render_coverage.py --check
          python3 .opencode/skills/home-service-website-audit/scripts/render_portable.py --check
          python3 .opencode/skills/home-service-website-audit/scripts/render_rubric.py \
            --rubric .opencode/skills/home-service-website-audit/references/legacy/rubric-v1.1.3.json \
            --out .opencode/skills/home-service-website-audit/references/legacy/rubric-v1.1.3.md \
            --check

      - name: Schema syntax
        run: |
          python3 -m json.tool .opencode/skills/home-service-website-audit/references/schema/audit-v2.schema.json > /dev/null
          python3 -m json.tool .opencode/skills/home-service-website-audit/references/schema/scores-v2.schema.json > /dev/null

      - name: Link check
        run: node scripts/check_links.mjs

      - name: Asset check
        run: node scripts/check_assets.mjs

      - name: Privacy scan
        run: node scripts/privacy_scan.mjs

      - name: Verify synthetic example
        run: |
          node .opencode/skills/home-service-website-audit/scripts/verify.mjs \
            --run examples/acme-plumbing \
            --report examples/acme-plumbing/full-report.md \
            --one-page examples/acme-plumbing/one-page.md \
            --index examples/README.md \
            --mutation --fixture --synthetic

      # CI does not audit production sites, submit forms, call businesses,
      # send messages, or make model calls. Cross-model evals are manual.
